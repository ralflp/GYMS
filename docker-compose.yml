version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: gym_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: gym_master
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/init-db.sql:/docker-entrypoint-initdb.d/init.sql

  backend:
    build: ./backend
    container_name: gym_backend
    restart: always
    environment:
      - PORT=3000
      - DB_USER=postgres
      - DB_PASSWORD=postgrespassword
      - DB_HOST=db
      - DB_NAME=gym_master
      - DB_PORT=5432
      - JWT_SECRET=super_secret_key_change_me_in_production
    ports:
      - "3000:3000"
    depends_on:
      - db

volumes:
  postgres_data:
